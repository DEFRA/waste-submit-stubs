services:
  waste-submit-stubs:
    build: ./
    ports:
      - '8085:8085'
    environment:
      ASPNETCORE_URLS: http://+:8085
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_VERSION: local
      # Simulated upstream latency for epr-common-data-api's approved-submissions route.
      # Presets: None 0/0, Typical 7443/6754, Worst 35020/0.
      CommonDataApi__ApprovedSubmissions__LatencyMs: ${COMMON_DATA_API_LATENCY_MS:-0}
      CommonDataApi__ApprovedSubmissions__LatencyJitterMs: ${COMMON_DATA_API_LATENCY_JITTER_MS:-0}
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8085/health']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cdp-tenant

networks:
  cdp-tenant:
    driver: bridge
